<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Croseus Gene Search Tool</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 3rem 0; margin-bottom: 2rem; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .search-card { background: white; border-radius: 15px; border: none; box-shadow: 0 10px 25px rgba(0,0,0,0.05); padding: 2rem; margin-bottom: 2rem; }
        .form-control-lg { border-radius: 10px; border: 2px solid #e9ecef; padding: 1rem; font-size: 1.1rem; }
        .form-control-lg:focus { border-color: #764ba2; box-shadow: 0 0 0 0.25rem rgba(118, 75, 162, 0.1); }
        .btn-search { background: #764ba2; color: white; border-radius: 10px; padding: 0 2rem; font-weight: 600; transition: all 0.3s; }
        .btn-search:hover { background: #5b3a7d; transform: translateY(-2px); color: white; }
        .table-card { background: white; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); overflow: hidden; border: none; }
        .table thead { background-color: #f8f9fa; color: #495057; }
        .table th { font-weight: 600; border-bottom: 2px solid #e9ecef; padding: 1rem; }
        .table td { padding: 1rem; vertical-align: middle; }
        .seq-row { display: none; background-color: #fdfdfd; }
        .seq-box { font-family: 'Courier New', monospace; background: #f1f3f5; padding: 15px; border-radius: 8px; font-size: 0.9em; color: #333; border-left: 4px solid #764ba2; word-break: break-all; }
        .badge-other { background-color: #e2e6ea; color: #666; font-size: 0.8em; margin-right: 4px; padding: 4px 8px; border-radius: 4px; display: inline-block; margin-bottom: 2px;}
    </style>
</head>
<body>

    <div class="header text-center">
        <div class="container">
            <h1 class="display-4 fw-bold"><i class="fas fa-dna me-3"></i>Catharanthus roseus information</h1>
            <p class="lead opacity-75">Search by New ID, Old ID (2016/2022), or Description</p>
        </div>
    </div>

    <div class="container">
        <div class="search-card">
            <div class="row g-3">
                <div class="col-md-9">
                    <div class="input-group">
                        <span class="input-group-text bg-white border-end-0"><i class="fas fa-search text-muted"></i></span>
                        <input type="text" class="form-control form-control-lg border-start-0" id="searchInput" placeholder="Enter Gene ID (M9H77... or CRO_...) or keyword...">
                    </div>
                </div>
                <div class="col-md-3 d-grid">
                    <button class="btn btn-search btn-lg" onclick="performSearch()">Search</button>
                </div>
            </div>
            <div id="status" class="mt-3 text-muted small"><i class="fas fa-spinner fa-spin me-2"></i>Loading database...</div>
        </div>

        <div class="table-card">
            <div class="table-responsive">
                <table class="table table-hover mb-0" id="resultsTable">
                    <thead>
                        <tr>
                            <th style="width: 15%">Gene ID</th>
                            <th style="width: 20%">Other Versions</th> <th style="width: 40%">Description</th>
                            <th style="width: 25%">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <tr><td colspan="4" class="text-center py-5 text-muted">Enter a search term above.</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
        
        <footer class="text-center mt-5 mb-5 text-muted small">&copy; 2025 Croseus Gene Database Project</footer>
    </div>

    <script>
        let db = [];
        const statusDiv = document.getElementById('status');
        const searchInput = document.getElementById('searchInput');

        fetch('data.json')
            .then(res => res.json())
            .then(data => {
                db = data;
                statusDiv.innerHTML = `<i class="fas fa-check-circle text-success me-2"></i>Database loaded: <strong>${db.length}</strong> genes ready.`;
            })
            .catch(err => {
                statusDiv.innerHTML = `<span class="text-danger">Error loading data.json.</span>`;
                console.error(err);
            });

        function performSearch() {
            const query = searchInput.value.toLowerCase().trim();
            const tbody = document.getElementById('tableBody');
            
            if (!query || query.length < 2) { alert("Please enter at least 2 characters."); return; }

            // NEW: Added 'item.Other_IDs' to the search filter
            const results = db.filter(item => {
                const searchStr = `${item.Gene_ID} ${item.Other_IDs} ${item.Description} ${item.Preferred_name}`.toLowerCase();
                return searchStr.includes(query);
            });

            statusDiv.innerHTML = `<i class="fas fa-list me-2"></i>Found <strong>${results.length}</strong> matches.`;
            tbody.innerHTML = '';

            if (results.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="text-center py-4 text-muted">No results found.</td></tr>`;
                return;
            }

            results.slice(0, 50).forEach(item => {
                const desc = item.Description || '<span class="text-muted fst-italic">No description</span>';
                
                // Format Other IDs as badges
                let otherIdsHtml = '<span class="text-muted small">-</span>';
                if (item.Other_IDs) {
                    otherIdsHtml = item.Other_IDs.split(',').map(id => 
                        `<span class="badge-other">${id.trim()}</span>`
                    ).join(' ');
                }

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="fw-bold text-primary">${item.Gene_ID}</td>
                    <td>${otherIdsHtml}</td>
                    <td><div style="max-height: 60px; overflow: hidden; text-overflow: ellipsis;">${desc}</div></td>
                    <td>
                        <button class="btn btn-outline-primary btn-sm rounded-pill px-3" onclick="toggleSeq('${item.Gene_ID}')">
                            <i class="fas fa-dna me-1"></i> Sequence
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);

                const trSeq = document.createElement('tr');
                trSeq.id = 'seq-' + item.Gene_ID;
                trSeq.className = 'seq-row';
                trSeq.innerHTML = `
                    <td colspan="4">
                        <div class="p-3">
                            <h6 class="text-primary mb-2">Protein Sequence</h6>
                            <div class="seq-box">${item.Sequence}</div>
                        </div>
                    </td>
                `;
                tbody.appendChild(trSeq);
            });
        }

        function toggleSeq(id) {
            const row = document.getElementById('seq-' + id);
            row.style.display = (row.style.display === 'table-row') ? 'none' : 'table-row';
        }

        searchInput.addEventListener('keypress', function (e) { if (e.key === 'Enter') performSearch(); });
    </script>
</body>
</html>
