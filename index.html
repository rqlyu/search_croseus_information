<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Croseus Gene Search Tool</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Gradient Header */
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 3rem 0;
            margin-bottom: 2rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        /* Card Styling */
        .search-card {
            background: white;
            border-radius: 15px;
            border: none;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            padding: 2rem;
            margin-bottom: 2rem;
        }

        /* Search Input Styling */
        .form-control-lg {
            border-radius: 10px;
            border: 2px solid #e9ecef;
            padding: 1rem;
            font-size: 1.1rem;
        }
        .form-control-lg:focus {
            border-color: #764ba2;
            box-shadow: 0 0 0 0.25rem rgba(118, 75, 162, 0.1);
        }

        .btn-search {
            background: #764ba2;
            color: white;
            border-radius: 10px;
            padding: 0 2rem;
            font-weight: 600;
            transition: all 0.3s;
        }
        .btn-search:hover {
            background: #5b3a7d;
            transform: translateY(-2px);
            color: white;
        }

        /* Table Styling */
        .table-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            overflow: hidden;
            border: none;
        }
        
        .table thead {
            background-color: #f8f9fa;
            color: #495057;
        }
        
        .table th {
            font-weight: 600;
            border-bottom: 2px solid #e9ecef;
            padding: 1rem;
        }
        
        .table td {
            padding: 1rem;
            vertical-align: middle;
        }

        /* Sequence Box */
        .seq-row {
            display: none;
            background-color: #fdfdfd;
        }
        .seq-box {
            font-family: 'Courier New', monospace;
            background: #f1f3f5;
            padding: 15px;
            border-radius: 8px;
            font-size: 0.9em;
            color: #333;
            border-left: 4px solid #764ba2;
            word-break: break-all;
        }

        .badge-custom {
            background-color: #e9ecef;
            color: #495057;
            font-weight: 500;
            margin-right: 5px;
        }
    </style>
</head>
<body>

    <div class="header text-center">
        <div class="container">
            <h1 class="display-4 fw-bold"><i class="fas fa-dna me-3"></i>C. roseus Gene Search</h1>
            <p class="lead opacity-75">Comprehensive database for gene annotations, sequences, and GO terms</p>
        </div>
    </div>

    <div class="container">
        
        <div class="search-card">
            <div class="row g-3">
                <div class="col-md-9">
                    <div class="input-group">
                        <span class="input-group-text bg-white border-end-0"><i class="fas fa-search text-muted"></i></span>
                        <input type="text" class="form-control form-control-lg border-start-0" id="searchInput" placeholder="Search by Gene ID, Description, or Preferred Name...">
                    </div>
                </div>
                <div class="col-md-3 d-grid">
                    <button class="btn btn-search btn-lg" onclick="performSearch()">Search Database</button>
                </div>
            </div>
            <div id="status" class="mt-3 text-muted small"><i class="fas fa-spinner fa-spin me-2"></i>Loading database...</div>
        </div>

        <div class="table-card">
            <div class="table-responsive">
                <table class="table table-hover mb-0" id="resultsTable">
                    <thead>
                        <tr>
                            <th style="width: 15%">Gene ID</th>
                            <th style="width: 15%">Preferred Name</th>
                            <th style="width: 45%">Description</th>
                            <th style="width: 25%">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <tr>
                            <td colspan="4" class="text-center py-5">
                                <div class="text-muted">
                                    <i class="fas fa-search fa-3x mb-3 opacity-25"></i>
                                    <p>Enter a search term above to find genes.</p>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
        
        <footer class="text-center mt-5 mb-5 text-muted small">
            &copy; 2025 Croseus Gene Database Project
        </footer>
    </div>

    <script>
        let db = [];
        const statusDiv = document.getElementById('status');
        const searchInput = document.getElementById('searchInput');

        // 1. Load Data on Startup
        fetch('data.json')
            .then(res => res.json())
            .then(data => {
                db = data;
                statusDiv.innerHTML = `<i class="fas fa-check-circle text-success me-2"></i>Database loaded: <strong>${db.length}</strong> genes ready.`;
            })
            .catch(err => {
                statusDiv.innerHTML = `<span class="text-danger"><i class="fas fa-exclamation-triangle me-2"></i>Error loading 'data.json'. Please check repository files.</span>`;
                console.error(err);
            });

        // 2. Search Function
        function performSearch() {
            const query = searchInput.value.toLowerCase().trim();
            const tbody = document.getElementById('tableBody');
            
            if (!query || query.length < 2) {
                alert("Please enter at least 2 characters to search.");
                return;
            }

            // Filter logic
            const results = db.filter(item => {
                const searchStr = `${item.Gene_ID} ${item.Description} ${item.Preferred_name} ${item.GO_term}`.toLowerCase();
                return searchStr.includes(query);
            });

            // Update Status
            statusDiv.innerHTML = `<i class="fas fa-list me-2"></i>Found <strong>${results.length}</strong> matches for "${query}".`;

            // Clear table
            tbody.innerHTML = '';

            if (results.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="4" class="text-center py-4 text-muted">
                            No results found. Try a different keyword.
                        </td>
                    </tr>`;
                return;
            }

            // Render Rows (Limit to 50 for performance)
            results.slice(0, 50).forEach(item => {
                // Generate safe description
                const desc = item.Description || '<span class="text-muted fst-italic">No description available</span>';
                const name = item.Preferred_name || '<span class="text-muted">-</span>';
                
                // Main Row
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="fw-bold text-primary">${item.Gene_ID}</td>
                    <td>${name}</td>
                    <td><div style="max-height: 60px; overflow: hidden; text-overflow: ellipsis;">${desc}</div></td>
                    <td>
                        <button class="btn btn-outline-primary btn-sm rounded-pill px-3" onclick="toggleSeq('${item.Gene_ID}')">
                            <i class="fas fa-dna me-1"></i> Sequence
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);

                // Sequence Row (Hidden)
                const trSeq = document.createElement('tr');
                trSeq.id = 'seq-' + item.Gene_ID;
                trSeq.className = 'seq-row';
                trSeq.innerHTML = `
                    <td colspan="4">
                        <div class="p-3">
                            <h6 class="text-primary mb-2"><i class="fas fa-code me-2"></i>Protein Sequence</h6>
                            <div class="seq-box">${item.Sequence}</div>
                            <button class="btn btn-sm btn-light mt-2 border" onclick="navigator.clipboard.writeText('${item.Sequence}'); alert('Sequence copied!')">
                                <i class="fas fa-copy me-1"></i> Copy to Clipboard
                            </button>
                        </div>
                    </td>
                `;
                tbody.appendChild(trSeq);
            });
        }

        // 3. Toggle Sequence Visibility
        function toggleSeq(id) {
            const row = document.getElementById('seq-' + id);
            if (row.style.display === 'table-row') {
                row.style.display = 'none';
            } else {
                row.style.display = 'table-row';
            }
        }

        // 4. "Enter" Key Support
        searchInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') performSearch();
        });
    </script>
</body>
</html>
